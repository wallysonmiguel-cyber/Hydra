name: Build Hydra APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extrair projetos
        run: |
          mkdir hydrapay hydraauth
          unzip -q HydraPay_Android.zip -d hydrapay
          unzip -q HydraAuthentication_Android.zip -d hydraauth

      - name: Compilar HydraPay
        working-directory: hydrapay
        run: gradle assembleDebug --no-daemon

      - name: Compilar Hydra Authentication
        working-directory: hydraauth
        run: gradle assembleDebug --no-daemon

      - name: Preparar APKs
        run: |
          mkdir -p apks
          cp hydrapay/app/build/outputs/apk/debug/app-debug.apk apks/HydraPay.apk
          cp hydraauth/app/build/outputs/apk/debug/app-debug.apk apks/HydraAuthentication.apk

      - name: Enviar APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-APKs
          path: apks/*.apk
